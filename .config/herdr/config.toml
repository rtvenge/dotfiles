onboarding = false
# herdr configuration
# Lives at ~/.config/herdr/config.toml (symlinked from dotfiles/.config/herdr)
# Migrated from tmux (Oh My Tmux + catppuccin mocha), see .config/tmux/tmux.conf.local

[theme]
name = "catppuccin"

# Pin the exact Mocha values you used in tmux_conf_theme_colour_* rather than
# trusting the built-in "catppuccin" flavor default.
[theme.custom]
panel_bg = "#1e1e2e" # base
accent = "#89b4fa"   # blue - matches tmux_conf_theme_pane_active_border / current window
red = "#f38ba8"
green = "#a6e3a1"
blue = "#89b4fa"
yellow = "#f9e2af"

[ui]
accent = "#89b4fa"
mouse_capture = true       # you had `set -g mouse on`

# Right edge of the tab bar -- the old tmux status-right (tmux.conf.local:274),
# which ran weather / uptime / time / hostname. herdr has native types for
# datetime and hostname; weather and uptime come from bin/herdr-status, because
# a `command` entry is the only hook for anything herdr doesn't model itself.
# Entries render on the herdr server and refresh independently.
tab_bar_right = [
  { type = "command", command = "/Users/ryantvenge/dotfiles/bin/herdr-status weather", interval_seconds = 900, timeout_seconds = 8 },
  { type = "command", command = "/Users/ryantvenge/dotfiles/bin/herdr-status uptime", interval_seconds = 60 },
  { type = "datetime", format = "%-I:%M %p" },
  { type = "hostname" },
]
tab_bar_right_separator = "  │  "

[keys]
prefix = "ctrl+s"

# Your tmux used C-h/C-l (not the default p/n letters) for window nav:
#   bind -r C-h previous-window ; bind -r C-l next-window
previous_tab = "prefix+ctrl+h"
next_tab = "prefix+ctrl+l"

# focus_pane_left/down/up/right default to prefix+h/j/k/l, matching your
# `bind -r h/j/k/l select-pane` muscle memory. Adding prefix+arrow on top,
# like tmux's stock prefix+Left/Down/Up/Right pane switching.
focus_pane_left = ["prefix+h", "prefix+left"]
focus_pane_down = ["prefix+j"]
focus_pane_up = ["prefix+k"]
focus_pane_right = ["prefix+l", "prefix+right"]

# Your tmux split habit: `|` = side-by-side, `-` = stacked
# (bind | split-window -h ; bind - split-window -v).
# Verify these land the direction you expect - herdr's vertical/horizontal
# naming may not line up with tmux's -h/-v flags - swap if reversed.
split_vertical = "prefix+|"
split_horizontal = "prefix+-"

# Tab reordering. Native since herdr 0.9.x; before that there was no move_tab_*
# action at all and these went through bin/herdr-move-tab, a wrapper around the
# socket API's tab.move.
move_tab_previous = "prefix+["
move_tab_next = "prefix+]"

# Rough equivalents for things you used plugins for:
#   tmux-sessionx / session picker -> workspace_picker = "prefix+w" (default)
#   new session (bind C-c)         -> new_workspace = "prefix+shift+n" (default)
#   tmux-menus                     -> toggle_sidebar = "prefix+b" (default)
# Left commented since they're already the defaults - uncomment to change.
# workspace_picker = "prefix+w"
# new_workspace = "prefix+shift+n"
# goto = "prefix+shift+o"

# lazygit popup - you already alias `lg` to lazygit
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"

# SpinupWP TUI popup (mwender/tap/spinuptui). Bare command, like lazygit above:
# it lives in /opt/homebrew/bin, which is on PATH everywhere. This was an
# absolute ~/.bun/bin path while spinuptui was a bun global -- that install is
# gone, so the old path pointed at nothing.
[[keys.command]]
key = "prefix+alt+s"
type = "popup"
command = "spinuptui"
width = "80%"
height = "80%"

# LaxyDocker popup.
[[keys.command]]
key = "prefix+alt+d"
type = "popup"
command = "LazyDocker"
width = "80%"
height = "80%"

[session]
# Closest equivalent to tmux-resurrect/continuum, but it only resumes
# supported AI-agent conversations, not arbitrary pane layouts/commands.
resume_agents_on_restore = true

[worktrees]
directory = "~/.herdr/worktrees"

[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

[[keys.command]]
key = "prefix+down"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"